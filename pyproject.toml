[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasync"
version = "0.1.0"
description = "An rsync-style binary delta synchronization tool: compute and apply minimal deltas between file versions using a rolling weak checksum and a blake2b strong hash."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
deltasync = "deltasync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
